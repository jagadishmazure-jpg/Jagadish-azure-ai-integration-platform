name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (offline, in-process services, sandbox stand-ins)
        run: pytest -q
      - name: Eval + contract gate (golden sets)
        run: python scripts/run_eval_gate.py --no-write
      - name: Runtime-safety gate (attacks contained, no false quarantines)
        run: python scripts/run_safety_evals.py --no-write
      - name: Control-plane contracts are current
        run: python scripts/export_contracts.py --check
      - name: Dashboards are generated from the KQL
        run: python scripts/build_dashboards.py --check
      - name: Doc drift (pasted output and code excerpts match the code)
        run: python scripts/doc_drift.py --check
      - name: Functions app indexes (Python v2 programming model)
        working-directory: functions
        run: python -c "import function_app as f; print([x.get_function_name() for x in f.app.get_functions()])"
      - name: End-to-end demo over real HTTP (15 local processes)
        run: python scripts/demo.py --out .demo-logs/demo-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: demo-logs, path: .demo-logs, if-no-files-found: ignore }
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Bicep CLI (pinned)
        run: |
          curl -sSLo bicep https://github.com/Azure/bicep/releases/download/v0.47.16/bicep-linux-x64
          chmod +x bicep && sudo mv bicep /usr/local/bin/bicep && bicep --version
      - name: bicep build (linter runs as part of build; warnings fail the job)
        run: |
          bicep build infra/main.bicep --stdout > /dev/null 2> bicep.log || { cat bicep.log; exit 1; }
          cat bicep.log
          if grep -q "Warning" bicep.log; then exit 1; fi

  k8s:
    # AKS manifests (k8s/) are generated from infra/main.bicep and validated offline against the
    # Kubernetes JSON schemas; nothing is applied to a cluster.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13" }
      - run: pip install pyyaml==6.0.3
      - name: Manifests are current (render_k8s.py --check)
        run: python scripts/render_k8s.py --check
      - name: Install kubeconform (pinned, checksum verified)
        run: |
          curl -sSLo kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tgz" | sha256sum -c -
          tar xzf kubeconform.tgz kubeconform
      - name: kubeconform (strict schema validation, Kubernetes 1.33)
        run: ./kubeconform -strict -summary -kubernetes-version 1.33.0 -ignore-filename-pattern kustomization.yaml k8s/

  sbom:
    # Software bill of materials for the source tree (lockfiles and manifests), kept as a build
    # artifact on every run. Image SBOMs, where the repo ships a container, come from the image job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Software bill of materials (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
          upload-release-assets: false

  secrets:
    # gitleaks over the full git history. Known false positives (public role IDs, synthetic
    # attack fixtures) are listed by fingerprint in .gitleaksignore.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
