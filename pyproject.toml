[project]
name = "azure-ai-integration-platform"
version = "0.1.0"
description = "Azure-native enterprise AI integration platform: Tool, MCP, A2A, Event and Identity gateways that let agents use SAP and SaaS systems without holding raw connections."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jagadish Meduri" }]
requires-python = ">=3.13"
# Resolved and installed together on 2026-09-25 (Python 3.13). See docs/sdk-notes.md.
dependencies = [
  "agent-framework-core==1.19.0",
  "agent-framework-foundry==1.13.1",
  "azure-ai-projects==2.6.1",        # agent-framework-foundry 1.13.1 requires <2.7
  "a2a-sdk[fastapi]==1.1.5",
  "mcp==2.2.0",
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "jsonschema==4.26.0",
  "pyjwt[crypto]==2.15.0",
  "cryptography==50.0.1",
  "msal==1.39.0",
  "azure-identity==1.25.3",
  "azure-keyvault-secrets==4.11.2",
  "azure-servicebus==7.14.3",
  "azure-eventgrid==4.22.1",
  "azure-functions==2.3.0",          # 2.x requires Python >= 3.13
  "azure-functions-durable==1.7.0",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",        # azure-monitor-opentelemetry 1.8.10 caps the SDK at <1.45
  "azure-monitor-opentelemetry==1.8.10",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests", "scripts", "functions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501", "RUF012"]
