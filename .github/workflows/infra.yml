# Infrastructure CI: runs on every pull request and on main. Nothing here touches Azure unless
# OIDC variables exist, and even then it only plans.
#   terraform fmt / init -backend=false / validate / test (mocked providers)
#   tflint (skipped with a warning if it cannot be installed)
#   checkov security scan (config: .checkov.yaml; unlisted findings fail the job)
#   container image builds + a local /healthz smoke run
#   terraform plan: only when AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID are set
name: infra
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true
env:
  TF_VERSION: "1.16.4"
  TF_IN_AUTOMATION: "1"
  STACK: infra/terraform
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - name: terraform fmt
        run: terraform -chdir="$STACK" fmt -check -recursive -diff
      - name: terraform init (no backend)
        run: terraform -chdir="$STACK" init -backend=false -input=false
      - name: terraform validate
        run: terraform -chdir="$STACK" validate
      - name: terraform test (offline plan with mocked providers)
        run: terraform -chdir="$STACK" test

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        id: setup
        continue-on-error: true
        with: { tflint_version: v0.64.0, github_token: "${{ github.token }}" }
      - name: tflint
        if: steps.setup.outcome == 'success'
        working-directory: ${{ env.STACK }}
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: tflint --init && tflint --recursive --format compact
      - name: tflint unavailable
        if: steps.setup.outcome != 'success'
        run: echo "::warning::tflint could not be installed; lint skipped (validate still enforced)"

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install --quiet checkov==3.3.20
      - name: checkov (Terraform)
        run: checkov -d "$STACK" --config-file .checkov.yaml

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore keyless signing of the provenance (main pushes only)
      attestations: write # store the provenance in the repo's attestation store
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: docker build (one image for every workload)
        run: docker build -t aiip:ci .
      - name: smoke run (tool gateway answers /healthz)
        run: |
          docker run -d --name aiip -p 8080:8080 aiip:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && exit 0; sleep 2; done
          docker logs aiip; exit 1
      - name: Trivy image scan, aiip (fixable HIGH/CRITICAL fail the job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: aiip:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Image SBOM, aiip (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: aiip:ci
          format: spdx-json
          artifact-name: image-sbom-aiip.spdx.json
          upload-release-assets: false
      - name: Save the image archive, aiip (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save aiip:ci -o image-aiip.tar
      - name: Build provenance for the image archive, aiip (keyless, main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: image-aiip.tar
      - name: Keep the attested archive for verification, aiip (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-aiip.tar
          path: image-aiip.tar
          retention-days: 5

  plan:
    needs: terraform
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Azure credentials present?
        id: creds
        run: |
          if [[ -n "$ARM_CLIENT_ID" && -n "$ARM_TENANT_ID" && -n "$ARM_SUBSCRIPTION_ID" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::terraform plan skipped: no Azure OIDC variables configured (fmt/validate/test/tflint/checkov still enforced)"
            echo "### terraform plan skipped (no Azure credentials configured)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.creds.outputs.present == 'true'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        if: steps.creds.outputs.present == 'true'
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        if: steps.creds.outputs.present == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: terraform init (remote state if configured, else local)
        if: steps.creds.outputs.present == 'true'
        env:
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
        run: |
          if [[ -n "$TFSTATE_RESOURCE_GROUP" && -n "$TFSTATE_STORAGE_ACCOUNT" ]]; then
            terraform -chdir="$STACK" init -input=false -backend-config=envs/dev.backend.hcl \
              -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
              -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
              -backend-config="container_name=${{ vars.TFSTATE_CONTAINER || 'tfstate' }}"
          else
            printf 'terraform {\n  backend "local" {}\n}\n' > "$STACK/backend_override.tf"
            terraform -chdir="$STACK" init -input=false
          fi
      - name: terraform plan (dev)
        if: steps.creds.outputs.present == 'true'
        run: |
          terraform -chdir="$STACK" plan -input=false -lock=false -var-file=envs/dev.tfvars -no-color -out=tfplan | tee plan.txt
          { echo '### terraform plan (dev)'; echo '```'; tail -n 40 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
